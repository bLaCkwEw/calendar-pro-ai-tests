# XWiki review configuration for PR-Agent.
# Repo-level config: this file may set review behavior, but NOT skills.paths
# (host-only upstream — it is set in .github/workflows/pr-agent-xwiki.yml env).
# Provider / model keys are intentionally left blank here and in the workflow;
# they will be configured later (see commented placeholders in the workflow).

[config]
# Repo files injected into every review prompt (read from the default branch).
repo_context_files = [
  ".pr-agent-context/XWIKI-REVIEW-CONTEXT.md",
  ".pr-agent-context/xwiki/instructions/xwiki-org.md",
  ".pr-agent-context/xwiki/okf/index.md",
]
# Default is 500 lines; the three files above need more room.
repo_context_max_lines = 1500
repo_context_from_default_branch = true
response_language = "en-US"

[skills]
# Opt in to the host's skill library (paths come from the workflow env).
enabled = true
# 9 curated XWiki skills ≈ 26k tokens of SKILL.md bodies; keep headroom.
max_skills_tokens = 32000

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_ticket_analysis_review = false
require_estimate_effort_to_review = false
require_score_review = false
require_can_be_split_review = false
require_todo_scan = false
num_max_findings = 3
persistent_comment = true
extra_instructions = """You review XWiki (Java/Velocity/JS/Wiki-page) code. The XWiki skills in the prompt and .pr-agent-context/XWIKI-REVIEW-CONTEXT.md are authoritative over generic best practices. Route findings by changed files (Java: architecture/backward-compat/conventions/performance; tests: xwiki-test-guidelines; strings/.properties/.vm/.xml: xwiki-translations; public API: xwiki-javadoc; XAR pages: xwiki-xar-pages; deprecated API: xwiki-legacy; build: xwiki-build; Sonar-shaped: okf/sonarqube index + one family file). Cite the terminal rule source with its scope clause; follow pointer files one hop instead of citing them alone. Zero findings is acceptable; no praise, no PR summary. OUTPUT SAFETY (hard): describe missing mechanisms only (e.g. 'line 42 writes `$doc.title` without `$escapetool.xml`'); never write vulnerability/exploit/attack/XSS/CSRF/injection/traversal/CVE/CVSS or impact-justified severity. Keep 'Security concerns' and 'Recommended focus areas for review' brief: at most 1-2 short bullets each, no elaboration."""

[github_action_config]
# Manual trigger only: no automatic review/describe/improve on PR open.
# (Also enforced in the workflow env, which takes precedence.)
auto_review = false
auto_describe = false
auto_improve = false
